<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transition v1</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="stage">
    <canvas id="canvas" class="empty"></canvas>
  </div>
  <div id="drop-hint">
    <div>Drop two images anywhere<br><br><b>or click a slot →</b></div>
  </div>
  <button id="toggle-panel" title="Hide controls (Tab)">‹</button>

  <div id="side">
    <div id="slot-bar">
      <div class="slots">
        <div class="slot" data-slot="A" title="Click to load image A, or drop an image here"><span class="lab">A</span><span class="placeholder">click / drop</span></div>
        <div class="slot" data-slot="B" title="Click to load image B, or drop an image here"><span class="lab">B</span><span class="placeholder">click / drop</span></div>
      </div>
      <div class="row-btns">
        <button id="swap" title="Swap A and B">Swap A ↔ B</button>
        <button id="reset" title="Restore the bundled Lerin defaults">Reset</button>
        <button id="clear" title="Empty both slots">Clear</button>
      </div>
    </div>
    <div id="tp-host"></div>
  </div>

  <input type="file" id="filepicker" accept="image/*">
  <script type="importmap">
  { "imports": { "tweakpane": "https://esm.sh/tweakpane@4.0.5" } }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
